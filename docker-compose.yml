services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jhfre}
      POSTGRES_USER: ${POSTGRES_USER:-jhfre}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jhfre} -d ${POSTGRES_DB:-jhfre}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile

    command: ["/app/entrypoint.sh"]

    expose:
      - "8001"

    environment:
      APP_ENV: ${APP_ENV:-production}
      PORT: ${PORT:-8001}

      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_ENCRYPTION_KEY: ${DJANGO_ENCRYPTION_KEY}

      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-jhfre.vihub.site}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-https://jhfre.vihub.site}

      DJANGO_SESSION_COOKIE_SAMESITE: ${DJANGO_SESSION_COOKIE_SAMESITE:-None}
      DJANGO_SESSION_COOKIE_SECURE: ${DJANGO_SESSION_COOKIE_SECURE:-true}

      DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-true}
      DJANGO_TRUST_X_FORWARDED_PROTO: ${DJANGO_TRUST_X_FORWARDED_PROTO:-true}
      SSO_FORCE_HTTPS: ${SSO_FORCE_HTTPS:-true}

      DATABASE_URL: postgresql://${POSTGRES_USER:-jhfre}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-jhfre}

      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}

    depends_on:
      db:
        condition: service_healthy

    restart: unless-stopped

volumes:
  postgres_data: