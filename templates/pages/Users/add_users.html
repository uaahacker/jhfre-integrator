{% extends 'base.html' %}
{% load static %}

{% block content %}
<style>
/* Neon Glow Animation for Button */
.neon-loading {
  position: relative;
  overflow: hidden;
  border-radius: 4px;
  z-index: 1;
}

/* Neon Glow Effect */
.neon-loading::after {
  content: '';
  position: absolute;
  top: -2px;
  left: -2px;
  right: -2px;
  bottom: -2px;
  border-radius: 4px;
    border: 2px solid transparent; /* Keep border-width for consistency */
  border-color: rgba(0, 198, 255, 0.3); /* Initial color */
    animation: neon-ring-pulse 1.5s ease-in-out infinite;
  pointer-events: none;
  z-index: -1; /* Move the glowing effect behind the button */
}

/* Keyframes for the Pulsating Neon Glow Animation */
@keyframes neon-ring-pulse {
    0%, 100% {
        border-color: rgba(0, 198, 255, 0.3);
    }
    50% {
        border-color: #00c6ff;
    }
}
</style>
<!-- Toolbar Section -->
<div id="kt_app_toolbar" class="app-toolbar py-3 py-lg-6">
    <div id="kt_app_toolbar_container" class="app-container container-fluid d-flex flex-stack">
        <div class="page-title d-flex flex-column justify-content-center flex-wrap me-3">
            <h1 class="page-heading d-flex text-gray-900 fw-bold fs-3 flex-column justify-content-center my-0">
                Add Users
            </h1>
            <ul class="breadcrumb breadcrumb-separatorless fw-semibold fs-7 my-0 pt-1">
                <li class="breadcrumb-item text-muted">
                    <a href="{% url 'home' %}" class="text-muted text-hover-primary">Home</a>
                </li>
                <li class="breadcrumb-item">
                    <span class="bullet bg-gray-500 w-5px h-2px"></span>
                </li>
            </ul>
        </div>
        <div class="d-flex align-items-center gap-2 gap-lg-3">
            <a href="{% url 'user_profile' %}" class="btn btn-sm btn-light-primary">Back</a>
        </div>
    </div>
</div>

<div class="container mt-5">
    <div class="d-flex flex-stack mb-5">
        <div class="d-flex align-items-center position-relative my-1">
            <i class="ki-duotone ki-magnifier fs-1 position-absolute ms-6"></i>
            <input type="text" id="searchBar" class="form-control form-control-solid w-250px ps-15" placeholder="Search Users"/>
        </div>
        <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#userModal" id="openAddUserModal">
            <i class="ki-duotone ki-plus fs-2"></i> Add User
        </button>
    </div>

    <!-- DataTable -->
    <table id="userTable" class="table table-bordered table-hover align-middle gy-5">
        <thead class="bg-light text-gray-500">
            <tr>
                <th>Username</th>
                <th>Email</th>
                <th>Role</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody class="text-gray-600 fw-semibold"></tbody>
    </table>
</div>

<!-- Add/Edit User Modal -->
<div class="modal fade" id="userModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="userModalTitle">Add User</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="userId">
                <div class="mb-3"><label>Username</label><input type="text" id="username" class="form-control"></div>
                <div class="mb-3"><label>Email</label><input type="email" id="email" class="form-control"></div>
                <div class="mb-3"><label>Password</label><input type="password" id="password" class="form-control"></div>
                <div class="mb-3">
                    <label>Role</label>
                    <select id="role" class="form-select">
                        <option value="User">User</option>
                        <option value="Staff">Staff</option>
                        <option value="Administrator">Administrator</option>
                    </select>
                </div>
                <div class="form-check">
                    <input type="checkbox" id="isActive" class="form-check-input">
                    <label>Active</label>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" id="cancelBtn" data-bs-dismiss="modal">Cancel</button>
                <button class="btn btn-primary" id="saveBtn">
                    <span id="saveSpinner" class="spinner-border spinner-border-sm d-none"></span>
                    Save
                </button>
                <!-- <button type="submit" id="saveBtn" class="btn btn-sm btn-light-primary fw-bold mt-2">
                    <span class="indicator-label" >Save</span>
                    <span class="indicator-progress" style="display: none;">
                        Please wait... <span class="spinner-border spinner-border-sm align-middle ms-2" id="saveSpinner"></span>
                    </span>
                </button> -->
            </div>
        </div>
    </div>
</div>

{% endblock %}

{% block extra_scripts %}
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
 $(document).ready(function () {
    let deleteUserId;
    let mode = 'add'; // Tracks whether modal is in Add or Edit mode

    // Initialize DataTable
    const table = $('#userTable').DataTable({
        ajax: { url: '/users/search/', type: 'GET', dataSrc: 'data' },
        columns: [
            { data: 'username' },
            { data: 'email' },
            { data: 'role' },
            { data: 'status' },
            {
                data: 'id',
                render: (id) => `
                    <div class="dropdown">
                        <button class="btn btn-sm btn-light-primary dropdown-toggle action-button" type="button" data-bs-toggle="dropdown" data-id="${id}">
                            Actions
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a href="#" class="dropdown-item edit-btn" data-id="${id}">Edit</a></li>
                            <li><a href="#" class="dropdown-item text-danger delete-btn" data-id="${id}">Delete</a></li>
                        </ul>
                    </div>
                `
            }
        ]
    });

    // ✅ Reset Modal Fields
    function resetUserModal() {
        $('#userId').val('');
        $('#username').val('');
        $('#email').val('');
        $('#password').val('');
        $('#role').val('User');
        $('#isActive').prop('checked', false);
        $('#userModalTitle').text('Add User');
        mode = 'add';
    }

    // ✅ Open Modal for Adding User
    $('#openAddUserModal').on('click', function () {
        resetUserModal();
        $('#userModal').modal('show');
    });

    // ✅ Open Modal for Editing User
     $('#userTable').on('click', '.edit-btn', function () {
        const id = $(this).data('id');
        mode = 'edit'; // Set mode to edit
        const actionButton = $(this).closest('.dropdown').find('.action-button');
        actionButton.addClass('neon-loading'); // Add loading class

        $.ajax({
            url: `/users/detail/${id}/`,
            method: 'GET',
            success: (data) => {
                $('#userId').val(id);
                $('#username').val(data.username);
                $('#email').val(data.email);
                $('#role').val(data.role);
                $('#isActive').prop('checked', data.is_active);
                $('#userModalTitle').text('Edit User');
                $('#userModal').modal('show');

            },
             error: () => {
                Swal.fire('Error', 'Failed to load user details.', 'error');
            },
            complete: () => {
                 actionButton.removeClass('neon-loading'); // Remove loading class
            }
        });
    });

    // ✅ Save User
    $('#saveBtn').on('click', function () {
        $('#saveSpinner').removeClass('d-none');
        const data = {
            username: $('#username').val(),
            email: $('#email').val(),
            password: $('#password').val(),
            role: $('#role').val(),
            is_active: $('#isActive').is(':checked')
        };
        const userId = $('#userId').val();
        const url = mode === 'edit' ? `/users/update/${userId}/` : '/users/add/';

        $.ajax({
            url: url,
            method: 'POST',
            headers: { 'X-CSRFToken': '{{ csrf_token }}' },
            data: JSON.stringify(data),
            contentType: 'application/json',
            success: () => {
                Swal.fire('Success', mode === 'edit' ? 'User updated!' : 'User added!', 'success');
                $('#userModal').modal('hide');
                table.ajax.reload();
            },
            error: () => {
                Swal.fire('Error', 'Failed to save user.', 'error');
            },
            complete: () => $('#saveSpinner').addClass('d-none')
        });
    });

    // ✅ Close/Cancel Button Handler
    $('#cancelBtn').on('click', function () {
        resetUserModal();
    });

    $('#userModal').on('hidden.bs.modal', function () {
        resetUserModal();
    });

    // ✅ Delete User
       $('#userTable').on('click', '.delete-btn', function () {
        const id = $(this).data('id');
          const actionButton = $(this).closest('.dropdown').find('.action-button');
        actionButton.addClass('neon-loading');
        deleteUserId = id;

        Swal.fire({
            title: 'Are you sure?',
            text: 'You will not be able to recover this user!',
            icon: 'warning',
            showCancelButton: true,
            confirmButtonText: 'Yes, delete it!',
            cancelButtonText: 'No, cancel'
        }).then((result) => {
            if (result.isConfirmed) {
                $.ajax({
                    url: `/users/delete/${deleteUserId}/`,
                    method: 'DELETE',
                    headers: { 'X-CSRFToken': '{{ csrf_token }}' },
                    success: () => {
                        Swal.fire('Deleted!', 'User has been deleted.', 'success');
                        table.ajax.reload();
                    },
                    complete: () => {
                         actionButton.removeClass('neon-loading'); // Remove loading class
                     }

                });
            }else{
                actionButton.removeClass('neon-loading'); // Remove loading class
            }
        });
    });


    // ✅ Search Users
    $('#searchBar').on('keyup', function () {
        table.search(this.value).draw();
    });
});

</script>
{% endblock %}
