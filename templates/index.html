<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #fff;
            overflow: hidden;
        }

        .container {
            text-align: center;
            max-width: 600px;
            padding: 20px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            background: rgba(0, 0, 0, 0.4);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.3);
        }

        .container h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
        }

        .container p {
            font-size: 1.2rem;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .container button {
            background: #4caf50;
            color: #fff;
            padding: 12px 25px;
            font-size: 1rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .container button:hover {
            background: #388e3c;
        }

        .container button:focus {
            outline: none;
            box-shadow: 0 0 8px rgba(76, 175, 80, 0.8);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to JHFRE Integrator</h1>
        <p>Dear Boss, we're working hard to make this project exceptional. Stay tuned for great results!</p>
        <button onclick="window.location.href='{% url 'home' %}';">Go to Dashboard</button>
    </div>
</body>
</html>
