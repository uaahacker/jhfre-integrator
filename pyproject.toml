[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jhfre-integrator"
version = "1.0.0"
description = "JHFRE Integrator - Enterprise Django web application for integration management with SAML/SSO authentication, multi-database support, and REST API"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "JHFRE Development Team"},
]
keywords = [
    "django", 
    "web-application", 
    "integrator", 
    "jhfre", 
    "saml-authentication",
    "sso",
    "rest-api",
    "enterprise",
    "multi-database",
    "postgresql",
    "mysql"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: Django",
    "Framework :: Django :: 5.1",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: System :: Systems Administration :: Authentication/Directory",
]
dependencies = [
    "asgiref==3.8.1",
    "certifi==2024.8.30",
    "charset-normalizer==3.4.0",
    "Django==5.1.2",
    "django-cleanup==9.0.0",
    "django-colorfield==0.11.0",
    "django-storages==1.14.4",
    "django-timezone-field==7.0",
    "djangorestframework==3.15.2",
    "idna==3.10",
    "isodate==0.7.2",
    "lxml==5.3.0",
    "pillow==11.0.0",
    "psycopg2-binary==2.9.10",
    "pycountry==24.6.1",
    "pyodbc==5.2.0",
    "python3-saml==1.16.0",
    "requests==2.32.3",
    "sqlparse==0.5.1",
    "tzdata==2024.2",
    "urllib3==2.2.3",
    "xmlsec==1.3.13",
    "gunicorn==23.0.0",
    "whitenoise==6.9.0",
    "cryptography",
    "dj-database-url~=1.0",
    "pymysql",
    "PyJWT==2.10.1",
    "python-jose==3.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-django",
    "black",
    "flake8",
    "isort",
    "mypy",
    "django-extensions",
    "django-debug-toolbar",
    "ipython",
    "ipdb",
]
test = [
    "pytest",
    "pytest-django",
    "pytest-cov",
    "factory-boy",
    "model-bakery",
]
production = [
    "sentry-sdk[django]",
    "redis",
    "celery",
]

[project.urls]
Homepage = "https://integrator.jhfreapps.jhu.edu"
Repository = "https://gitlab.com/hostlint/cloud-sysbrix.git"
Documentation = "https://integrator.jhfreapps.jhu.edu/docs"
"Bug Reports" = "https://gitlab.com/hostlint/cloud-sysbrix/-/issues"
"Development" = "https://dev.jhfreapps.jhu.edu"

[project.scripts]
jhfre-manage = "manage:main"

# Django app configuration for AI understanding
[tool.setuptools]
packages = [
    "core",           # Main Django project settings
    "accounts",       # User account management
    "integrator",     # Core integration functionality  
    "jhfreassistant", # Assistant features
    "saml_auth",      # SAML authentication
    "sso_auth",       # SSO authentication
]

[tool.setuptools.package-data]
"*" = [
    "*.html", "*.css", "*.js", "*.json", "*.txt", "*.md",
    "templates/**/*", "static/**/*", "media/**/*",
    "migrations/*.py", "management/commands/*.py"
]

# Code formatting with Black - GitHub Copilot will respect these settings
[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | migrations
  | node_modules
)/
'''

# Import sorting - helps AI suggest properly organized imports
[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_django = "django"
known_drf = "rest_framework"
known_first_party = [
    "core", 
    "accounts", 
    "integrator", 
    "jhfreassistant", 
    "saml_auth", 
    "sso_auth"
]
sections = [
    "FUTURE",
    "STDLIB", 
    "THIRDPARTY",
    "DJANGO",
    "DRF", 
    "FIRSTPARTY",
    "LOCALFOLDER"
]
skip_glob = ["*/migrations/*"]

# Linting configuration
[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "E266", "E501", "W503", "F403", "F401"]
max-complexity = 12
exclude = [
    ".git",
    "__pycache__",
    "*/migrations/*",
    ".venv",
    "venv",
    "build",
    "dist",
    "node_modules",
    "static/assets/*",
]
per-file-ignores = [
    "__init__.py:F401",
    "settings.py:F405",
]

# Type checking - helps AI understand type expectations
[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
strict_optional = true
disallow_untyped_defs = false  # Gradual typing for Django project
exclude = [
    "migrations/",
    "venv/",
    ".venv/",
    "static/",
    "media/",
]

# Django-specific mypy settings
[[tool.mypy.overrides]]
module = "*.migrations.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "manage"
ignore_errors = true

# Testing configuration - AI will understand test patterns
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "core.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
python_classes = ["Test*", "*Tests"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config", 
    "--verbose",
    "--tb=short",
    "--cov=.",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html:htmlcov",
    "--cov-report=xml",
    "--reuse-db",
    "--nomigrations",
]
testpaths = [
    "tests",
    "accounts/tests.py", 
    "integrator/tests.py",
    "jhfreassistant/tests",
    "saml_auth/tests.py",
    "sso_auth/tests"
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests", 
    "unit: marks tests as unit tests",
    "saml: marks tests related to SAML authentication",
    "sso: marks tests related to SSO authentication",
    "api: marks tests for REST API endpoints",
    "database: marks tests that require database access",
]
filterwarnings = [
    "ignore::django.utils.deprecation.RemovedInDjango50Warning",
    "ignore::DeprecationWarning",
]

# Coverage configuration
[tool.coverage.run]
source = ["."]
omit = [
    "manage.py",
    "*/migrations/*", 
    "*/venv/*",
    "*/.venv/*",
    "*/tests/*",
    "*/test_*.py", 
    "*_test.py",
    "core/wsgi.py",
    "core/asgi.py",
    "*/settings/*",
    "static/*",
    "media/*",
    "htmlcov/*",
]
branch = true

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError", 
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

# Django-specific configurations for AI understanding
[tool.django-stubs]
django_settings_module = "core.settings"

# Project-specific AI hints
[tool.jhfre-integrator]
# This section helps AI understand project-specific patterns
django_apps = [
    "accounts",      # User management, profiles, authentication
    "integrator",    # Core business logic, integrations, APIs
    "jhfreassistant", # AI assistant features
    "saml_auth",     # SAML authentication provider
    "sso_auth",      # Single Sign-On authentication
]
authentication_methods = ["saml", "sso", "jwt", "session"]
database_backends = ["postgresql", "mysql", "sqlite3", "odbc"]
api_framework = "django-rest-framework"
deployment_target = "production"
frontend_integration = true
file_uploads = true
multi_tenant = false
